[manifest]
summary = "PyCardano off-chain GiftCard library (importable) + a CLI to run create/redeem txs"

[[files]]
source = "pyproject.toml"
dest = "pyproject.toml"

[[files]]
source = "Justfile.jinja"
dest = "Justfile"

[[files]]
source = ".env.example"
dest = ".env.example"

[[files]]
source = ".gitignore"
dest = ".gitignore"

[[files]]
source = "src/giftcard/__init__.py"
dest = "src/giftcard/__init__.py"

[[files]]
source = "src/giftcard/__main__.py"
dest = "src/giftcard/__main__.py"

[[files]]
source = "src/giftcard/contract.py"
dest = "src/giftcard/contract.py"

[[files]]
source = "src/giftcard/env.py"
dest = "src/giftcard/env.py"

[[files]]
source = "src/giftcard/flat.py"
dest = "src/giftcard/flat.py"

[[files]]
source = "tests/test_contract.py"
dest = "tests/test_contract.py"

[[files]]
source = "tests/test_flat.py"
dest = "tests/test_flat.py"

[[files]]
source = "tests/test_integration.py"
dest = "tests/test_integration.py"
