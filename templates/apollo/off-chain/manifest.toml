[manifest]
summary = "Apollo (Go) off-chain GiftCard package (importable) + a CLI to run create/redeem txs"

[[files]]
source = "go.mod.jinja"
dest = "go.mod"

[[files]]
source = "go.sum"
dest = "go.sum"

[[files]]
source = "Justfile.jinja"
dest = "Justfile"

[[files]]
source = ".env.example"
dest = ".env.example"

[[files]]
source = "gitignore"
dest = ".gitignore"

[[files]]
source = "giftcard/contract.go"
dest = "giftcard/contract.go"

[[files]]
source = "giftcard/blueprint.go"
dest = "giftcard/blueprint.go"

[[files]]
source = "giftcard/bundle/.gitkeep"
dest = "giftcard/bundle/.gitkeep"

[[files]]
source = "giftcard/contract_test.go"
dest = "giftcard/contract_test.go"

[[files]]
source = "giftcard/integration_test.go.jinja"
dest = "giftcard/integration_test.go"

[[files]]
source = "config/config.go.jinja"
dest = "config/config.go"

[[files]]
source = "cmd/giftcard/main.go.jinja"
dest = "cmd/giftcard/main.go"
