[manifest]
summary = "Apollo (Go) off-chain GiftCard package (importable) + a CLI to run create/redeem txs"

[[files]]
source = "go.mod.jinja"
dest = "go.mod"

[[files]]
source = "go.sum"
dest = "go.sum"

[[files]]
source = "Justfile.jinja"
dest = "Justfile"

[[files]]
