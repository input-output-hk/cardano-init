[package]
name = "cardano-init"
version = "0.2.0"
edition = "2024"
description = "Scaffold a complete, runnable Cardano protocol project in seconds."
repository = "https://github.com/input-output-hk/cardano-init"
license = "Apache-2.0"
readme = "README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
rust-embed = { version = "8", features = ["include-exclude"] }
thiserror = "2"
minijinja = "2"
clap = { version = "4", features = ["derive"] }
dialoguer = "0.11"
console = "0.15"
indicatif = "0.17"
# `custom_styling` lets comfy-table measure the width of `console`-styled
# (ANSI-escaped) cell content correctly, so colored cells stay aligned.
comfy-table = { version = "7", features = ["custom_styling"] }
# Used only for its `Diagnostic` derive (to attach `code`/`help` to errors,
# which our own presenter reads); the graphical `fancy` handler is not used.
miette = "7"
serde_json = "1"

# Unix-only: reset the SIGPIPE disposition so piping into `head`/`less` and
# quitting early exits cleanly instead of panicking on a broken pipe.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
