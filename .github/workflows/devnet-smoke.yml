# Proves generated projects work end to end on a Yaci devnet.
# CARDANO_INIT_REQUIRE_DEVNET=1 turns the template's graceful skips into failures,
# so a green run can't be vacuous. PRs run only the rows they affect.

name: devnet-smoke

on:
  schedule:
    - cron: "0 8 * * 1" # Mondays 08:00 UTC, after tool-smoke (06:00) and installer-recipes (07:00)
  workflow_dispatch: {} # allow manual runs
  # The `run-devnet-smoke` label forces every row on a PR. Re-add to re-run.
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

# The label is in the group so that adding an unrelated label can't cancel a run.
concurrency:
  group: devnet-smoke-${{ github.event.pull_request.number || github.run_id }}-${{ github.event.label.name }}
  cancel-in-progress: true

jobs:
  detect:
    # A `labeled` event fires for every label, so filter to ours.
    if: github.event.action != 'labeled' || github.event.label.name == 'run-devnet-smoke'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.devnet }}
      has_rows: ${{ steps.select.outputs.has_devnet }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: select
        env:
          BASE: ${{ github.event.action != 'labeled' && github.event.pull_request.base.sha || '' }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/select_checks.py ${BASE:+"$BASE" "$HEAD"}

  devnet:
    needs: detect
    if: needs.detect.outputs.has_rows == 'true'
    name: yaci devnet end-to-end (${{ matrix.variant }})
    runs-on: ubuntu-latest
    # Haskell variants compile parts of the Plutus stack from source.
    timeout-minutes: ${{ matrix.toolchain == 'haskell' && 300 || 60 }}
    strategy:
      fail-fast: false # one variant breaking must not mask the others
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    outputs:
      failed: ${{ steps.failed.outputs.failed }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      # Keep in lockstep with templates/apollo/off-chain/go.mod.jinja.
      - name: Install Go
        if: contains(matrix.tools, 'apollo')
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"

      - name: Install uv
        if: contains(matrix.tools, 'pycardano')
        uses: astral-sh/setup-uv@v10.3.3

      # yaci-cli and yaci-store are JVM services.
      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install sbt
        if: matrix.toolchain == 'scalus'
        uses: sbt/setup-sbt@v1

      - name: Install Aiken
        if: contains(matrix.tools, 'aiken')
        uses: aiken-lang/setup-aiken@v1
        with:
          # Keep this in lockstep with templates/aiken/on-chain/aiken.toml.jinja.
          version: v1.1.21

      - name: Install yaci-devkit
        id: yaci
        run: |
          npm install -g @bloxbean/yaci-devkit
          npm list -g @bloxbean/yaci-devkit
          devkit_version=$(npm list -g @bloxbean/yaci-devkit --json | node -pe 'JSON.parse(require("fs").readFileSync(0, "utf8")).dependencies["@bloxbean/yaci-devkit"].version')
          echo "version=$devkit_version" >> "$GITHUB_OUTPUT"

      # Cache downloads only, never local-clusters, generated configuration or
      # PID files. A new DevKit release needs its matching component binaries;
      # restoring the old unversioned cache can break submit-api at startup.
      - name: Cache yaci-cli downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.yaci-cli/cardano-node
            ~/.yaci-cli/components
          key: yaci-downloads-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.yaci.outputs.version }}

      - name: Set up Nix for Haskell
        if: matrix.toolchain == 'haskell'
        uses: ./.github/actions/setup-haskell-nix

      # Outside the checkout so the project gets its own git repo: inside one, the
      # scaffold skips `git init` and Nix can't see the untracked flake.
      - name: Scaffold project in isolation
        working-directory: ${{ runner.temp }}
        run: cargo run --quiet --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" -- --name devnet-smoke ${{ matrix.flags }} --devnet yaci

      - name: Build & run the end-to-end devnet smoke
        working-directory: ${{ runner.temp }}/devnet-smoke
        env:
          CARDANO_INIT_REQUIRE_DEVNET: "1"
          RUN: ${{ matrix.toolchain == 'haskell' && 'nix develop .#minimal --command' || '' }}
        run: |
          $RUN just build
          if [ -d off-chain/node_modules/@meshsdk ]; then
            $RUN npm --prefix off-chain ls @meshsdk/core @meshsdk/provider @meshsdk/transaction
          fi
          $RUN just test

      - name: Preserve devnet diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devnet-diagnostics-${{ matrix.variant }}
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/devnet-smoke/devnet/.yaci-devnet.log
            ${{ runner.temp }}/devnet-smoke/off-chain/package-lock.json
          if-no-files-found: ignore
          retention-days: 14

      # Set only when a step failed or the job timed out. A lost runner runs no
      # steps, so it leaves this unset and doesn't file an issue.
      - name: Mark failure
        id: failed
        if: failure() || cancelled()
        run: echo "failed=true" >> "$GITHUB_OUTPUT"

  notify-on-failure:
    needs: devnet
    # Only file an issue for the unattended scheduled run, not manual debugging.
    if: failure() && github.event_name == 'schedule' && needs.devnet.outputs.failed == 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const label = "devnet-smoke";
            const title = "Devnet smoke failed: the Yaci devnet no longer works end to end";
            const today = new Date().toISOString().slice(0, 10);
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              `The weekly devnet end-to-end smoke failed on ${today}.`,
              ``,
              `A scaffolded fullstack project's devnet↔off-chain seam stopped working —`,
              `likely a breaking yaci-devkit release, a cardano-node download/boot`,
              `failure, or upstream drift in the off-chain provider. The run log shows`,
              `which stage failed (devnet boot, indexer liveness, or the round-trip).`,
              ``,
              `Run: ${runUrl}`,
            ].join("\n");

            // De-dupe: comment on the existing open issue instead of spamming a
            // new one every Monday. (Creating an issue auto-creates the label.)
            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: "open", labels: label,
            });
            if (existing.data.length === 0) {
              await github.rest.issues.create({ owner, repo, title, body, labels: [label] });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.data[0].number, body,
              });
            }
