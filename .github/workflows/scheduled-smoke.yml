# Scheduled maintenance gate.
#
# Purpose: detect when a *generated project* stops building/testing because of
# EXTERNAL drift — a Cardano hardfork, a breaking upstream tool release, or an
# unmaintained dependency — even though nothing in this repo changed. The
# templates pin floating version ranges (e.g. meshjs "^1.7.0", aiken stdlib
# "v2"), so this can happen with zero commits here and would otherwise go
# unnoticed until a user hits it.
#
# This is DISTINCT from the PR/commit gates (which catch regressions we
# introduce). It runs the per-tool build smoke tests the docs already require
# (ARCHITECTURE §11, PRD SM-1), but on a schedule, and opens a tracking issue
# on failure.

name: scheduled-smoke

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  workflow_dispatch: {} # allow manual runs

permissions:
  contents: read

jobs:
  smoke:
    name: ${{ matrix.variant }} build+test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # one variant breaking must not mask the others
      matrix:
        # Only tools that are meant to build green are listed. Remaining
        # placeholders (blaster, yaci) are intentionally excluded — their `just`
        # targets only echo, so they have no external dependency to drift. Add a
        # tool here the moment its template becomes genuinely build-green.
        #
        # `variant` is the unique display/dir key; `tool` selects the toolchain
        # setup below (one tool can appear as several variants — e.g. Scalus
        # fills on-chain, off-chain, and the fullstack collapse, each a distinct
        # template that must build green on its own).
        include:
          - variant: aiken
            tool: aiken
            flags: --on-chain aiken
          - variant: meshjs
            tool: meshjs
            flags: --off-chain meshjs
          - variant: scalus-on-chain
            tool: scalus
            flags: --on-chain scalus
          - variant: scalus-off-chain
            tool: scalus
            flags: --off-chain scalus
          - variant: scalus-fullstack
            tool: scalus
            # Sugar for `--on-chain scalus --off-chain scalus`: both roles
            # collapse into one unified `protocol/` sbt build.
            flags: --fullstack scalus
          # Haskell on-chain tools run their `--nix` variant: the component
          # flake supplies GHC, cabal and the crypto libraries Plutus needs
          # (blst has no Ubuntu package), mostly prebuilt from cache.iog.io,
          # and the run also checks the template's pinned flake.lock still works.
          - variant: plinth
            tool: haskell
            flags: --on-chain plinth --nix
          - variant: plutarch
            tool: haskell
            flags: --on-chain plutarch --nix
    # Haskell variants compile parts of the Plutus stack from source.
    timeout-minutes: ${{ matrix.tool == 'haskell' && 300 || 60 }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install just
        uses: extractions/setup-just@v4

      # --- per-tool toolchain (extend as the matrix grows) ---
      - name: Install Aiken
        if: matrix.tool == 'aiken'
        uses: aiken-lang/setup-aiken@v1
        with:
          #Keep this in lockstep with templates/aiken/on-chain/aiken.toml.jinja.
          version: v1.1.21

      - name: Install Node
        if: matrix.tool == 'meshjs'
        uses: actions/setup-node@v5
        with:
          node-version: 20

      # Scalus templates are Scala 3 / sbt builds: they need a JDK and sbt.
      - name: Install JDK
        if: matrix.tool == 'scalus'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Keep in lockstep with templates/scalus/*/project/build.properties
          # and build.sbt.jinja's declared JDK baseline.
          java-version: 21
      - name: Install sbt
        if: matrix.tool == 'scalus'
        uses: sbt/setup-sbt@v1

      # The haskell.nix store (GHC plus Plutus dependencies) does not fit in
      # the runner's default free space.
      - name: Free disk space
        if: matrix.tool == 'haskell'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install Nix
        if: matrix.tool == 'haskell'
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            extra-substituters = https://cache.iog.io https://cache.zw3rk.com
            extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ= loony-tools:pr9m4BkM/5/eSTZlkQyRt57Jz7OMBxNSUiMC4FkcNfk=
            accept-flake-config = true

      - name: Scaffold project in isolation
        run: cargo run --quiet -- --name smoke-${{ matrix.variant }} ${{ matrix.flags }}

      - name: Build & test the generated project
        working-directory: smoke-${{ matrix.variant }}
        # Each component's Justfile installs its own deps (e.g. meshjs `_install`
        # runs `npm install` in off-chain/ on first build), so `just build` is
        # self-sufficient from the project root — no per-tool dep step here.
        env:
          # The --nix variants run in the minimal dev shell (toolchain only, no
          # language server or linters, which would build from source).
          RUN: ${{ matrix.tool == 'haskell' && 'nix develop .#minimal --command' || '' }}
        run: |
          $RUN just build
          $RUN just test

  notify-on-failure:
    needs: smoke
    # Only file an issue for the unattended scheduled run, not manual debugging.
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const label = "scheduled-smoke";
            const title = "Scheduled smoke test failed: a generated project no longer builds";
            const today = new Date().toISOString().slice(0, 10);
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              `The weekly per-tool smoke run failed on ${today}.`,
              ``,
              `A generated project stopped building/testing with no change to this repo —`,
              `likely a Cardano hardfork, a breaking upstream tool release, or an`,
              `unmaintained dependency. Investigate which template drifted.`,
              ``,
              `Run: ${runUrl}`,
            ].join("\n");

            // De-dupe: comment on the existing open issue instead of spamming a
            // new one every Monday. (Creating an issue auto-creates the label.)
            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: "open", labels: label,
            });
            if (existing.data.length === 0) {
              await github.rest.issues.create({ owner, repo, title, body, labels: [label] });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.data[0].number, body,
              });
            }
