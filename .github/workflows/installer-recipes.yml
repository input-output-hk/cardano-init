# Scheduled installer-recipe gate.
#
# Purpose: prove the `cardano-init doctor` install recipes in
# `registry/deps.toml` still WORK against the live world. For each installer,
# this runs every recipe that offers it (in an environment where that installer
# is native) and checks the dep's declared binaries end up on PATH.
#
# Two-tier design (the other tier is the PR gate in ci.yml → `cargo test`):
#   • PR gate      — `src/doctor/catalog.rs` tests prove every recipe PARSES and
#                    names a known installer. Pure, fast, no network. Per commit.
#   • THIS gate    — proves each recipe actually INSTALLS its binary. Network-
#                    and world-dependent (a renamed package, a moved install
#                    script, a formula rename), so it drifts with zero commits
#                    here — same class of problem as tool-smoke.yml, hence
#                    a schedule + a tracking issue, never a PR gate.
#
# Coverage lives in .github/scripts/verify_installers.py, not here: its TESTED
# table generates this workflow's matrix and the "Tested install commands" table
# in docs/user-guide/commands.md, and its EXCLUDED table lists any installer we
# deliberately don't run, with the reason. ci.yml runs `--check`, which fails if
# deps.toml uses an installer that is in neither table, so coverage can't shrink
# unnoticed. Each run also writes its scope to the job summary, so a green run
# says what it did and didn't test.

name: installer-recipes

on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC, one hour after tool-smoke
  workflow_dispatch: {} # allow manual runs
  # Opt-in per-PR run: add the `run-installer-recipes` label to a PR to run
  # this (world-dependent, expensive) gate against that PR's code. It stays off
  # the every-commit path — re-add the label to re-run.
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  plan:
    if: github.event_name != 'pull_request' || github.event.label.name == 'run-installer-recipes'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - id: matrix
        run: echo "matrix=$(python3 .github/scripts/verify_installers.py --matrix)" >> "$GITHUB_OUTPUT"
      - name: Write coverage to the job summary
        run: python3 .github/scripts/verify_installers.py --scope

  verify:
    needs: plan
    name: ${{ matrix.installer }} recipes
    runs-on: ${{ matrix.runs-on }}
    # Empty for host rows → no container. Set where a clean image matters: a
    # distro package manager's native image, or installers whose tools the
    # hosted image already ships.
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false # one installer breaking must not mask the others
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      # Bare distro containers lack the basics checkout and the recipes need.
      - name: Bootstrap container
        if: matrix.container != ''
        run: |
          apt-get update
          apt-get install -y sudo python3 git curl ca-certificates

      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # ghcup's documented system requirements on Ubuntu (a C toolchain and the
      # libraries GHC links against). A developer machine has these; a bare
      # container doesn't.
      - name: Install ghcup prerequisites (curl)
        if: matrix.installer == 'curl'
        run: apt-get install -y build-essential libffi-dev libgmp-dev libncurses-dev pkg-config

      # GitHub's Windows images ship winget, but its source agreement must be
      # accepted once before it installs anything headless. This doesn't change
      # the recipes' commands; it's the one-time prompt a user answers on first use.
      - name: Prepare winget
        if: matrix.installer == 'winget'
        shell: pwsh
        run: |
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
            Write-Error "winget is not on this runner image"
            exit 1
          }
          winget --version
          winget list --accept-source-agreements | Out-Null

      # --- per-installer prerequisites: make `matrix.installer` native ---

      - name: Install Nix
        if: matrix.installer == 'nix'
        uses: DeterminateSystems/nix-installer-action@main

      - name: Install Node (for npm)
        if: matrix.installer == 'npm' || matrix.installer == 'aikup'
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install Rust (for cargo)
        if: matrix.installer == 'cargo'
        uses: dtolnay/rust-toolchain@stable

      - name: Install Go
        if: matrix.installer == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: stable

      # aikup is itself a bootstrappable installer (Installer::bootstrap ⇒ node
      # → npm → @aiken-lang/aikup). Install it so its own recipes can run.
      - name: Bootstrap aikup
        if: matrix.installer == 'aikup'
        run: npm install -g @aiken-lang/aikup

      # tx3up is likewise a bootstrappable installer (Installer::bootstrap ⇒
      # tx3up). Install the manager via its own installer script, then put it on
      # PATH so its recipe (`tx3up install` → the toolchain) can run.
      - name: Bootstrap tx3up
        if: matrix.installer == 'tx3up'
        run: |
          curl -LsSf https://github.com/tx3-lang/tx3up/releases/latest/download/tx3up-installer.sh | sh
          tx3up_bin="$(find "$HOME" -maxdepth 4 -type f -name tx3up 2>/dev/null | head -1)"
          if [ -z "$tx3up_bin" ]; then echo "tx3up not found after install" >&2; exit 1; fi
          dirname "$tx3up_bin" >> "$GITHUB_PATH"

      - name: Verify recipes for ${{ matrix.installer }}
        if: runner.os != 'Windows'
        run: |
          # Container jobs run as root with HOME=/github/home. rustup treats a
          # HOME that isn't the user's own as an error (it suspects sudo) and
          # exits 1 after installing. A user's HOME is their own, so match that.
          if [ "$(id -u)" = 0 ]; then export HOME=/root; fi
          python3 .github/scripts/verify_installers.py ${{ matrix.installer }}

      # From Windows PowerShell, the shell Windows ships, as a user would run
      # these. Git Bash puts GNU tar ahead of Windows' tar.exe, and GNU tar
      # reads `C:\...` as a remote host. PowerShell 7 (pwsh) leaks its module
      # path into the recipes' `powershell` child, which then can't load
      # Microsoft.PowerShell.Security. Either breaks the aikup installer.
      - name: Verify recipes for ${{ matrix.installer }}
        if: runner.os == 'Windows'
        shell: powershell
        run: python .github/scripts/verify_installers.py ${{ matrix.installer }}

  notify-on-failure:
    needs: verify
    # Only file an issue for the unattended scheduled run, not manual debugging.
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const label = "installer-recipes";
            const title = "Installer recipe check failed: a doctor install recipe no longer works";
            const today = new Date().toISOString().slice(0, 10);
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              `The weekly installer-recipe check failed on ${today}.`,
              ``,
              `One or more \`cardano-init doctor\` recipes in registry/deps.toml no`,
              `longer install their binary — likely a renamed package, a moved`,
              `install script, or a formula rename upstream. The failing job name`,
              `is the installer; its log lists the affected dep(s).`,
              ``,
              `Run: ${runUrl}`,
            ].join("\n");

            // De-dupe: comment on the existing open issue instead of spamming a
            // new one every Monday. (Creating an issue auto-creates the label.)
            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: "open", labels: label,
            });
            if (existing.data.length === 0) {
              await github.rest.issues.create({ owner, repo, title, body, labels: [label] });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.data[0].number, body,
              });
            }
