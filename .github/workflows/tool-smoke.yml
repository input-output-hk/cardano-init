# Checks each tool's generated project builds and passes its tests. Weekly runs
# catch external drift (hardforks, upstream releases), since templates pin floating
# version ranges. PRs run only the rows they affect.

name: tool-smoke

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  workflow_dispatch: {} # allow manual runs
  pull_request:

permissions:
  contents: read

concurrency:
  group: tool-smoke-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.smoke }}
      has_rows: ${{ steps.select.outputs.has_smoke }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: select
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/select_checks.py ${BASE:+"$BASE" "$HEAD"}

  smoke:
    needs: detect
    if: needs.detect.outputs.has_rows == 'true'
    name: ${{ matrix.variant }} build+test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # one variant breaking must not mask the others
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    # Haskell variants compile parts of the Plutus stack from source.
    timeout-minutes: ${{ matrix.toolchain == 'haskell' && 300 || 60 }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Install Aiken
        if: contains(matrix.tools, 'aiken')
        uses: aiken-lang/setup-aiken@v1
        with:
          # Keep this in lockstep with templates/aiken/on-chain/aiken.toml.jinja.
          version: v1.1.21

      - name: Install Node
        if: matrix.toolchain == 'node' || matrix.toolchain == 'tx3'
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install uv
        if: contains(matrix.tools, 'pycardano')
        uses: astral-sh/setup-uv@v10.3.3

      - name: Install JDK
        if: matrix.toolchain == 'scalus'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Keep in lockstep with templates/scalus/*/project/build.properties
          # and build.sbt.jinja's declared JDK baseline.
          java-version: 21
      - name: Install sbt
        if: matrix.toolchain == 'scalus'
        uses: sbt/setup-sbt@v1

      - name: Install tx3up
        if: matrix.toolchain == 'tx3'
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/tx3-lang/tx3up/releases/latest/download/tx3up-installer.sh | sh

      - name: Install the Tx3 toolchain
        if: matrix.toolchain == 'tx3'
        run: |
          tx3up install
          echo "$HOME/.tx3/stable/bin" >> "$GITHUB_PATH"

      - name: Set up Nix for Haskell
        if: matrix.toolchain == 'haskell'
        uses: ./.github/actions/setup-haskell-nix

      # Outside the checkout so the project gets its own git repo: inside one, the
      # scaffold skips `git init` and Nix can't see the untracked flake.
      - name: Scaffold project in isolation
        working-directory: ${{ runner.temp }}
        run: cargo run --quiet --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" -- --name smoke-${{ matrix.variant }} ${{ matrix.flags }}

      - name: Build & test the generated project
        working-directory: ${{ runner.temp }}/smoke-${{ matrix.variant }}
        env:
          # The --nix variants run in the minimal dev shell (toolchain only, no
          # language server or linters, which would build from source).
          RUN: ${{ matrix.toolchain == 'haskell' && 'nix develop .#minimal --command' || '' }}
        run: |
          $RUN just build
          $RUN just test

  notify-on-failure:
    needs: smoke
    # Only file an issue for the unattended scheduled run, not manual debugging.
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const label = "scheduled-smoke";
            const title = "Scheduled smoke test failed: a generated project no longer builds";
            const today = new Date().toISOString().slice(0, 10);
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              `The weekly per-tool smoke run failed on ${today}.`,
              ``,
              `A generated project stopped building/testing with no change to this repo —`,
              `likely a Cardano hardfork, a breaking upstream tool release, or an`,
              `unmaintained dependency. Investigate which template drifted.`,
              ``,
              `Run: ${runUrl}`,
            ].join("\n");

            // De-dupe: comment on the existing open issue instead of spamming a
            // new one every Monday. (Creating an issue auto-creates the label.)
            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: "open", labels: label,
            });
            if (existing.data.length === 0) {
              await github.rest.issues.create({ owner, repo, title, body, labels: [label] });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.data[0].number, body,
              });
            }
