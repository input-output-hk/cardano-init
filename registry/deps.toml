# Dependency recipes for the `cardano-init doctor` (TECH_SPEC §9.2).
#
# Keyed by dep id. Each recipe has:
#   binaries  presence check — the dep is present if any of these is on PATH
#   docs      universal fallback when the resolver can't produce a plan
#   install   ordered list of single-key { installer = arg } methods (order = preference)
#   version   how to read the installed version, only when a tool sets a
#             minimum for this dep (tech-spec §9.7). Default: run the first
#             present binary with `--version` and take the first dotted
#             version it prints. Override with `{ args = [...] }`, or
#             `{ npm = "<package>" }` to read the package.json behind the
#             binary without running it.
#   after_upgrade  optional command chained onto every upgrade command, for
#             deps that download their own components.
#
# Installer keys are validated against the closed `Installer` enum in
# src/doctor/installers.rs at load (unknown installer → load error). Recipes are
# data; installers are code. Shared deps (node, jvm) are defined once and
# referenced by many tools' `system_deps`.

# --- base / derived dep (owned by no tool) ---

[just]
binaries = ["just"]
docs = "https://just.systems"
install = [{ brew = "just" }, { apt = "just" }, { cargo = "just" }, { nix = "just" }]

# --- tool system_deps ---

[node]
binaries = ["node"]
docs = "https://nodejs.org/en/download"
install = [{ brew = "node" }, { apt = "nodejs" }, { winget = "OpenJS.NodeJS" }, { nix = "nodejs" }]

# uv also downloads the Python version a project needs. No apt: it isn't in the
# stock Debian and Ubuntu repositories.
[uv]
binaries = ["uv"]
docs = "https://docs.astral.sh/uv/getting-started/installation/"
install = [{ brew = "uv" }, { winget = "astral-sh.uv" }, { nix = "uv" }, { curl = "https://astral.sh/uv/install.sh" }]
support = [
  { name = "VS Code extension", url = "https://marketplace.visualstudio.com/items?itemName=ms-python.python" },
  { name = "Pyright (language server)", url = "https://github.com/microsoft/pyright" },
]

# The tx3 toolchain (trix, dolos, cshell, tx3c) — installed by `tx3up install`,
# which bundles them under ~/.tx3. tx3up is a bootstrappable installer (like
# aikup): the `[tx3up]` dep below provides it, so `doctor` installs tx3up first,
# then runs `tx3up install` here.
[tx3]
binaries = ["trix"]
docs = "https://docs.txpipe.io/tx3/installation"
install = [{ tx3up = "" }]
support = [
  { name = "VS Code extension", url = "https://marketplace.visualstudio.com/items?itemName=TxPipe.tx3" },
  { name = "Language server", url = "https://github.com/tx3-lang/tx3-lsp" },
]

[aiken]
binaries = ["aiken"]
docs = "https://aiken-lang.org/installation-instructions"
install = [{ aikup = "" }, { nix = "aiken" }]
support = [
  { name = "VS Code extension", url = "https://marketplace.visualstudio.com/items?itemName=TxPipe.aiken" },
  { name = "Neovim plugin", url = "https://github.com/aiken-lang/editor-integration-nvim" },
  { name = "Zed extension", url = "https://github.com/aiken-lang/zed-aiken" },
  { name = "Emacs mode", url = "https://github.com/aiken-lang/aiken-mode" },
  { name = "JetBrains plugin", url = "https://github.com/MedusaLabs-cardano/intellij_aiken" },
  { name = "Online playground", url = "https://play.aiken-lang.org" },
]

[sbt]
binaries = ["sbt"]
docs = "https://www.scala-sbt.org/download.html"
# No stock `apt` package: sbt ships only via its own scala-sbt apt repo, which a
# single-package recipe can't add — so apt is deliberately omitted (use brew/nix).
install = [{ brew = "sbt" }, { nix = "sbt" }]
support = [
  { name = "Metals (Scala language server)", url = "https://scalameta.org/metals/" },
  { name = "VS Code extension", url = "https://marketplace.visualstudio.com/items?itemName=scalameta.metals" },
  { name = "Neovim plugin", url = "https://github.com/scalameta/nvim-metals" },
  { name = "IntelliJ IDEA Scala plugin", url = "https://plugins.jetbrains.com/plugin/1347-scala" },
]

[jvm]
binaries = ["java"]
docs = "https://adoptium.net/installation"
install = [{ brew = "openjdk" }, { apt = "default-jdk" }, { winget = "EclipseAdoptium.Temurin.21.JDK" }, { nix = "jdk" }]

[docker]
binaries = ["docker"]
docs = "https://docs.docker.com/get-docker/"
install = [{ brew = "docker" }, { apt = "docker.io" }, { winget = "Docker.DockerDesktop" }, { nix = "docker" }]

[cabal]
binaries = ["cabal"]
docs = "https://www.haskell.org/ghcup/"
# ghcup (via curl) is IOG's recommended way to get a matching GHC + Cabal.
install = [{ brew = "cabal-install" }, { apt = "cabal-install" }, { nix = "cabal-install" }, { curl = "https://get-ghcup.haskell.org" }]

[ghc]
binaries = ["ghc"]
docs = "https://www.haskell.org/ghcup/"
# Plinth targets GHC 9.6.x and Plutarch GHC 9.8.x; ghcup can install both side by side.
install = [{ brew = "ghc" }, { apt = "ghc" }, { nix = "haskell.compiler.ghc966" }, { curl = "https://get-ghcup.haskell.org" }]
support = [
  { name = "Haskell Language Server", url = "https://haskell-language-server.readthedocs.io" },
  { name = "VS Code extension", url = "https://marketplace.visualstudio.com/items?itemName=haskell.haskell" },
]

# The Yaci DevKit CLI, which the Yaci devnet template's `just dev` and `just test`
# call. Distributed on npm (Linux x64 and macOS arm64), so `doctor` ofers Node
# first when it is missing. Its version is read from the npm package: running
# `yaci-devkit --version` boots the CLI, which kills any running devnet.
[yaci-devkit]
binaries = ["yaci-devkit"]
docs = "https://devkit.yaci.xyz"
install = [{ npm = "@bloxbean/yaci-devkit" }]
version = { npm = "@bloxbean/yaci-devkit" }
# The CLI caches cardano-node, yaci-store, etc. under ~/.yaci-cli and keeps
# them across upgrades; a newer CLI with the old node fails to start a devnet.
after_upgrade = "yaci-devkit download --overwrite"

# --- installer-provider deps (reached via installer `bootstrap` lists) ---

[aikup]
binaries = ["aikup"]
docs = "https://aiken-lang.org/installation-instructions"
install = [{ npm = "@aiken-lang/aikup" }, { curl = "https://install.aiken-lang.org" }, { powershell = "https://windows.aiken-lang.org" }]

[cardano-up]
binaries = ["cardano-up"]
docs = "https://github.com/blinklabs-io/cardano-up"
install = [{ go = "github.com/blinklabs-io/cardano-up/cmd/cardano-up@latest" }]
# No `--version` flag. A `go install` build reports `devel`, so its version is
# unknown and the floor is not enforced (never blocks on a version it can't read).
version = { args = ["version"] }

# tx3up: the tx3 toolchain manager (provides the `tx3up` installer used by [tx3]).
# `brew install txpipe/tap/tx3up` gets the binary; the curl script is the
# cross-platform fallback. Running it installs only tx3up itself — the toolchain
# lands via `tx3up install` (the [tx3] recipe).
[tx3up]
binaries = ["tx3up"]
docs = "https://docs.txpipe.io/tx3/installation"
install = [{ brew = "txpipe/tap/tx3up" }, { curl = "https://github.com/tx3-lang/tx3up/releases/latest/download/tx3up-installer.sh" }]

[rustup]
binaries = ["rustup"]
docs = "https://www.rust-lang.org/tools/install"
install = [{ brew = "rustup" }, { curl = "https://sh.rustup.rs" }, { nix = "rustup" }]

[rust]
binaries = ["cargo", "rustc"]
docs = "https://www.rust-lang.org/tools/install"
install = [{ curl = "https://sh.rustup.rs" }, { nix = "cargo" }]

[go]
binaries = ["go"]
docs = "https://go.dev/doc/install"
install = [{ brew = "go" }, { apt = "golang" }, { winget = "GoLang.Go" }, { nix = "go" }]
support = [
  { name = "gopls (Go language server)", url = "https://go.dev/gopls/" },
  { name = "VS Code extension", url = "https://marketplace.visualstudio.com/items?itemName=golang.go" },
]

# --- catalog reference (no tool requires it today; see §9.1) ---

[process-compose]
binaries = ["process-compose"]
docs = "https://f1bonacc1.github.io/process-compose/"
# process-compose is not in homebrew-core; it lives in the maintainer's tap.
# `brew install` auto-taps a tap-qualified formula.
install = [{ brew = "f1bonacc1/tap/process-compose" }, { go = "github.com/f1bonacc1/process-compose@latest" }, { nix = "process-compose" }]
