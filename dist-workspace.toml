[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "npm"]
# Publish jobs to run in CI (npm publishes the package to npmjs.com)
publish-jobs = ["npm"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# The npm installer only handles .tar.gz; force it for all platforms (tar is
# available on modern Windows, so the PowerShell installer still works).
unix-archive = ".tar.gz"
windows-archive = ".tar.gz"

# npm is ENABLED (unscoped package `cardano-init`). Requires an NPM_TOKEN repo
# secret (npm granular token, read/write publish). The first tagged release
# publishes and thereby claims the name on npmjs.com.
#
# Deferred distribution channels — intentionally OFF until we have the credentials/repos:
#   - Homebrew: add "homebrew" to `installers` + set `tap` to a formula repo (needs a tap repo + token).
#   - crates.io: add "cargo" to `publish-jobs` (needs a CARGO_REGISTRY_TOKEN secret).
# Re-run `dist init && dist generate` after enabling any of these.

# GitHub retired the macos-14 runner that dist 0.32 picks for Apple Silicon by
# default, so pin that target to a supported image.
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-15"
